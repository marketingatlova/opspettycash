<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petty Cash Submission</title>
<style>
  :root {
    --purple: #6A0DAD;
    --purple-dark: #4B0082;
    --purple-light: #F3EAFB;
    --ink: #1C1B1F;
    --ink-soft: #5B5862;
    --line: #E3DEEC;
    --bg: #FAF9FC;
    --white: #FFFFFF;
    --danger: #C2410C;
    --ok: #1B7A43;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(28, 27, 31, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Sarabun", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 140px;
  }

  header.top {
    position: sticky;
    top: 0;
    background: var(--purple);
    color: white;
    padding: 18px 20px;
    margin: 0 -16px 20px;
    border-radius: 0 0 18px 18px;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  header.top .heading h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header.top .heading p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: 0.85;
  }

  .lang-toggle {
    flex-shrink: 0;
    display: flex;
    background: rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 3px;
    margin-top: 2px;
  }

  .lang-toggle button {
    border: none;
    background: transparent;
    color: white;
    font-size: 12.5px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 17px;
    cursor: pointer;
    opacity: 0.7;
  }

  .lang-toggle button.active {
    background: white;
    color: var(--purple-dark);
    opacity: 1;
  }

  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  .card h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--purple);
    margin: 0 0 14px;
    font-weight: 700;
  }

  .field {
    margin-bottom: 14px;
  }

  .field:last-child { margin-bottom: 0; }

  .field label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .field label .optional {
    color: var(--ink-soft);
    font-weight: 400;
    font-size: 12.5px;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"],
  .field select {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: var(--white);
    color: var(--ink);
    font-family: inherit;
  }

  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 0 3px var(--purple-light);
  }

  .field .hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 5px;
  }

  .upload-zone {
    border: 1.5px dashed var(--line);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }

  .upload-zone:hover, .upload-zone.has-file {
    border-color: var(--purple);
    background: var(--purple-light);
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .upload-zone .upload-label {
    font-size: 13.5px;
    color: var(--purple);
    font-weight: 600;
  }

  .upload-zone .upload-sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .upload-preview {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .upload-preview img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
  }

  .upload-preview .file-meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    flex: 1;
    text-align: left;
  }

  .upload-preview .file-meta strong {
    color: var(--ink);
    display: block;
    word-break: break-all;
  }

  .item-block {
    position: relative;
  }

  .item-block .item-number {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 26px;
    font-weight: 800;
    color: var(--purple-light);
    line-height: 1;
  }

  .item-block .remove-item {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: underline;
  }

  .item-block .remove-item:hover { color: var(--danger); }

  .add-item-btn {
    width: 100%;
    padding: 14px;
    border: 1.5px dashed var(--purple);
    background: var(--white);
    color: var(--purple);
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
  }

  .add-item-btn:active { background: var(--purple-light); }

  .add-item-btn:disabled {
    border-color: var(--line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .total-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--white);
    border-top: 1px solid var(--line);
    padding: 14px 16px;
    box-shadow: 0 -2px 12px rgba(28,27,31,0.08);
    z-index: 20;
  }

  .total-bar-inner {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .total-info { line-height: 1.2; }

  .total-info .label {
    font-size: 11.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .total-info .amount {
    font-size: 21px;
    font-weight: 800;
    color: var(--purple-dark);
  }

  .submit-btn {
    flex-shrink: 0;
    background: var(--purple);
    color: white;
    border: none;
    padding: 14px 26px;
    font-size: 15.5px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
  }

  .submit-btn:active { background: var(--purple-dark); }

  .submit-btn:disabled {
    background: var(--line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,27,31,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  .overlay.show { display: flex; }

  .overlay-card {
    background: white;
    border-radius: 14px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }

  .overlay-card .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--purple-light);
    border-top-color: var(--purple);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .overlay-card h3 { margin: 0 0 6px; font-size: 17px; }
  .overlay-card p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }

  .overlay-card.success .icon, .overlay-card.error .icon {
    font-size: 38px;
    margin-bottom: 10px;
  }

  .overlay-card.success h3 { color: var(--ok); }
  .overlay-card.error h3 { color: var(--danger); }

  .overlay-card button {
    margin-top: 18px;
    background: var(--purple);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .error-text {
    color: var(--danger);
    font-size: 12.5px;
    margin-top: 6px;
    display: none;
  }

  .field.invalid input,
  .field.invalid select { border-color: var(--danger); }

  .field.invalid .error-text { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--purple-light); }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="heading">
      <h1 data-i18n="title">Petty Cash Submission</h1>
      <p data-i18n="subtitle">Fill in your expenses below — add up to 5 items per submission.</p>
    </div>
    <div class="lang-toggle">
      <button type="button" id="langEn" class="active">EN</button>
      <button type="button" id="langTh">ไทย</button>
    </div>
  </header>

  <form id="pettyForm" novalidate>

    <div class="card">
      <h2 data-i18n="submissionInfo">Submission Info</h2>

      <div class="field" data-field="company">
        <label for="company" data-i18n="company">Company</label>
        <select id="company" name="company" required>
          <option value="" disabled selected data-i18n="selectCompany">Select company…</option>
          <option value="BIANCA HOLDING">BIANCA HOLDING</option>
          <option value="HOLY BELLY EMS">HOLY BELLY EMS</option>
          <option value="LOVA HOSPITALITY">LOVA HOSPITALITY</option>
        </select>
        <div class="error-text" data-i18n="errCompany">Please select a company.</div>
      </div>

      <div class="field" id="branchField" data-field="branch" style="display:none;">
        <label for="branch" data-i18n="branch">Branch</label>
        <select id="branch" name="branch">
          <option value="" data-i18n="allBranches">ALL BRANCHES</option>
          <option value="BIANCA EMSPHERE">BIANCA EMSPHERE</option>
          <option value="BIANCA ONE BANGKOK">BIANCA ONE BANGKOK</option>
          <option value="BIANCA ICONSIAM">BIANCA ICONSIAM</option>
          <option value="BIANCA TERMINAL 21">BIANCA TERMINAL 21</option>
          <option value="BIANCA SIAM PARAGON">BIANCA SIAM PARAGON</option>
        </select>
        <div class="hint" data-i18n="branchHint">Leave as "ALL BRANCHES" if this expense covers every Bianca location.</div>
      </div>

      <div class="field" data-field="payee">
        <label for="payee"><span data-i18n="payee">Payee</span> <span class="optional" data-i18n="payeeOptional">(optional — defaults to Nuttawat Sakulsantiporn)</span></label>
        <select id="payee" name="payee">
          <option value="" data-i18n="payeeDefault">— Default (Nuttawat Sakulsantiporn) —</option>
        </select>
      </div>

      <div class="field" data-field="dueDate">
        <label for="dueDate" data-i18n="dueDate">Due Date</label>
        <input type="date" id="dueDate" name="dueDate" required>
        <div class="error-text" data-i18n="errDate">Please select a date.</div>
      </div>
    </div>

    <div id="itemsContainer"></div>

    <button type="button" class="add-item-btn" id="addItemBtn" data-i18n="addItem">+ Add another item</button>

  </form>

  <div class="total-bar">
    <div class="total-bar-inner">
      <div class="total-info">
        <div class="label" id="itemCountLabel">1 item</div>
        <div class="amount" id="totalAmount">0.00 THB</div>
      </div>
      <button type="submit" form="pettyForm" class="submit-btn" id="submitBtn" data-i18n="submit">Submit</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card" id="overlayCard"></div>
</div>

<script>
// ============================================================
// TRANSLATIONS
// ============================================================
const I18N = {

    successBody: (doc) => `Voucher ${doc} has been created and sent to the team.`,
    errorTitle: "Submission failed",
    notConnected: "This form has not been connected to the backend yet. Set SUBMIT_URL in the page source.",
    genericError: "Something went wrong. Please try again or contact finance.",

    submissionInfo: "ข้อมูลการส่งคำขอ",
    company: "บริษัท",
    selectCompany: "เลือกบริษัท…",
    errCompany: "กรุณาเลือกบริษัท",
    branch: "สาขา",
    allBranches: "ทุกสาขา",
    branchHint: 'เลือก "ทุกสาขา" หากค่าใช้จ่ายนี้ครอบคลุมทุกสาขาของบิอันก้า',

    payeeDefault: "— ค่าเริ่มต้น (Nuttawat Sakulsantiporn) —",
    dueDate: "วันครบกำหนด",
    errDate: "กรุณาเลือกวันที่",
    addItem: "+ เพิ่มรายการ",
    addItemMax: (n) => `เพิ่มได้สูงสุด ${n} รายการ`,
    submit: "ส่งคำขอ",
    item: "รายการ",
    optionalTag: "(ไม่บังคับ)",
    date: "วันที่",
    particulars: "รายละเอียดค่าใช้จ่าย",
    particularsPlaceholder: "ค่าใช้จ่ายนี้เกี่ยวกับอะไร?",
    errParticulars: "กรุณากรอกรายละเอียดค่าใช้จ่าย",
    supplier: "ชื่อผู้ขาย / ร้านค้า",
    supplierPlaceholder: "เช่น Shopee, Grab, 7-Eleven",
    errSupplier: "กรุณากรอกชื่อผู้ขาย",
    amount: "จำนวนเงิน (บาท)",
    errAmount: "กรุณากรอกจำนวนเงินให้ถูกต้อง",
    receipt: "ใบเสร็จ / สลิป",
    receiptOptional: "(ไม่บังคับ)",
    uploadLabel: "แตะเพื่อถ่ายรูปหรือเลือกไฟล์",
    uploadSub: "JPG, PNG หรือ PDF",
    removeItem: "ลบรายการนี้",
    itemCount: (n) => `${n} รายการ`,
    totalSuffix: " บาท",
    submittingTitle: "กำลังส่งคำขอ…",
    submittingBody: "กำลังบันทึกค่าใช้จ่ายและสร้างเอกสาร อาจใช้เวลาถึงหนึ่งนาที โดยเฉพาะถ้ามีรูปใบเสร็จ — กรุณาอย่าปิดหน้านี้",
    successTitle: "ส่งคำขอสำเร็จ",
    successBody: (doc) => `สร้างเอกสารเลขที่ ${doc} และส่งให้ทีมแล้ว`,
    errorTitle: "ส่งคำขอไม่สำเร็จ",
    notConnected: "ฟอร์มนี้ยังไม่ได้เชื่อมต่อกับระบบหลังบ้าน กรุณาตั้งค่า SUBMIT_URL ในซอร์สโค้ดของหน้านี้",
    genericError: "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้งหรือติดต่อฝ่ายการเงิน",
    networkError: "ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่",

let currentLang = 'en';
function t(key, ...args) {
  const entry = I18N[currentLang][key];
  return typeof entry === 'function' ? entry(...args) : entry;
}

// ============================================================
// CONFIG — replace with your deployed Apps Script Web App URL
// ============================================================
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbyrvWzxnhK4lh7NmeorMHTzv2FSMAhTaZa0mmh2PY5Bbw7A1tvGVUEc5mbsRjThxWq2/exec";

const MAX_ITEMS = 5;

const itemsContainer = document.getElementById('itemsContainer');
const addItemBtn = document.getElementById('addItemBtn');
const companySelect = document.getElementById('company');
const branchField = document.getElementById('branchField');
const payeeSelect = document.getElementById('payee');
const totalAmountEl = document.getElementById('totalAmount');
const itemCountLabelEl = document.getElementById('itemCountLabel');
const overlay = document.getElementById('overlay');
const overlayCard = document.getElementById('overlayCard');
const submitBtn = document.getElementById('submitBtn');

// ============================================================
// LANGUAGE TOGGLE
// ============================================================
function applyStaticTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const val = t(key);
    if (typeof val === 'string') el.textContent = val;
  });
  document.documentElement.lang = currentLang;
}

function rerenderDynamicText() {
  // Item blocks contain JS-generated text that data-i18n can't reach
  // directly (labels built at creation time) — refresh them in place.
  itemsContainer.querySelectorAll('.item-block').forEach(block => {
    refreshItemBlockText(block);
  });
  updateAddButton();
  updateTotal();
}

document.getElementById('langEn').addEventListener('click', () => setLang('en'));
document.getElementById('langTh').addEventListener('click', () => setLang('th'));

function setLang(lang) {
  currentLang = lang;
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  document.getElementById('langTh').classList.toggle('active', lang === 'th');
  applyStaticTranslations();
  rerenderDynamicText();
}

// ============================================================
// ITEM BLOCKS
// ============================================================
function buildItemBlock(n) {
  const wrap = document.createElement('div');
  wrap.className = 'card item-block';
  wrap.dataset.itemIndex = n;
  wrap.innerHTML = itemBlockHtml(n);

  wrap.querySelector('.item-amount').addEventListener('input', updateTotal);

  const fileInput = wrap.querySelector('.item-receipt');
  const uploadZone = wrap.querySelector('.upload-zone');
  const previewEl = wrap.querySelector('.upload-preview');

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    uploadZone.classList.add('has-file');
    let displayUrl = '';
    let processedBase64 = null;

    if (file.type.startsWith('image/')) {
      const result = await compressImage(file);
      processedBase64 = result.base64;
      displayUrl = result.base64;
    } else if (file.type === 'application/pdf') {
      processedBase64 = await fileToBase64(file);
    }

    wrap.dataset.receiptBase64 = processedBase64 || '';
    wrap.dataset.receiptFileName = file.name;

    previewEl.style.display = 'flex';
    previewEl.innerHTML = `
      ${displayUrl ? `<img src="${displayUrl}" alt="">` : '<div style="width:52px;height:52px;border-radius:6px;background:var(--purple-light);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--purple);font-weight:700;">PDF</div>'}
      <div class="file-meta"><strong>${escapeHtml(file.name)}</strong>${(file.size/1024).toFixed(0)} KB</div>
    `;
  });

  const removeBtn = wrap.querySelector('.remove-item');
  if (removeBtn) {
    removeBtn.addEventListener('click', () => {
      wrap.remove();
      renumberItems();
      updateTotal();
      updateAddButton();
    });
  }

  return wrap;
}

function itemBlockHtml(n) {
  const isFirst = n === 1;
  return `
    <div class="item-number">${n}</div>
    <h2>${t('item')} ${n}${isFirst ? '' : ' <span class="optional" style="text-transform:none;font-weight:400;">' + t('optionalTag') + '</span>'}</h2>

    <div class="field" data-field="date">
      <label>${t('date')}</label>
      <input type="date" class="item-date" ${isFirst ? 'required' : ''}>
      <div class="error-text">${t('errDate')}</div>
    </div>

    <div class="field" data-field="particulars">
      <label>${t('particulars')}</label>
      <input type="text" class="item-particulars" placeholder="${t('particularsPlaceholder')}" ${isFirst ? 'required' : ''}>
      <div class="error-text">${t('errParticulars')}</div>
    </div>

    <div class="field" data-field="supplier">
      <label>${t('supplier')}</label>
      <input type="text" class="item-supplier" placeholder="${t('supplierPlaceholder')}" ${isFirst ? 'required' : ''}>
      <div class="error-text">${t('errSupplier')}</div>
    </div>

    <div class="field" data-field="amount">
      <label>${t('amount')}</label>
      <input type="number" class="item-amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" ${isFirst ? 'required' : ''}>
      <div class="error-text">${t('errAmount')}</div>
    </div>

    <div class="field" data-field="receipt">
      <label>${t('receipt')} <span class="optional">${t('receiptOptional')}</span></label>
      <div class="upload-zone">
        <input type="file" class="item-receipt" accept="image/*,application/pdf" capture="environment">
        <div class="upload-label">${t('uploadLabel')}</div>
        <div class="upload-sub">${t('uploadSub')}</div>
      </div>
      <div class="upload-preview" style="display:none;"></div>
    </div>

    ${!isFirst ? `<button type="button" class="remove-item">${t('removeItem')}</button>` : ''}
  `;
}

// When the language changes, item blocks need their text refreshed WITHOUT
// losing whatever the person already typed into the inputs.
function refreshItemBlockText(block) {
  const n = parseInt(block.dataset.itemIndex, 10);
  const isFirst = n === 1;

  // Save current values
  const saved = {
    date: block.querySelector('.item-date')?.value || '',
    particulars: block.querySelector('.item-particulars')?.value || '',
    supplier: block.querySelector('.item-supplier')?.value || '',
    amount: block.querySelector('.item-amount')?.value || '',
  };
  const preview = block.querySelector('.upload-preview');
  const previewHtml = preview ? preview.innerHTML : '';
  const previewDisplay = preview ? preview.style.display : 'none';
  const hasFileClass = block.querySelector('.upload-zone')?.classList.contains('has-file');

  block.innerHTML = itemBlockHtml(n);

  block.querySelector('.item-date').value = saved.date;
  block.querySelector('.item-particulars').value = saved.particulars;
  block.querySelector('.item-supplier').value = saved.supplier;
  block.querySelector('.item-amount').value = saved.amount;

  if (previewHtml) {
    const newPreview = block.querySelector('.upload-preview');
    newPreview.innerHTML = previewHtml;
    newPreview.style.display = previewDisplay;
  }
  if (hasFileClass) block.querySelector('.upload-zone').classList.add('has-file');

  // Re-wire events (innerHTML replacement wiped the old listeners)
  block.querySelector('.item-amount').addEventListener('input', updateTotal);

  const fileInput = block.querySelector('.item-receipt');
  const uploadZone = block.querySelector('.upload-zone');
  const previewEl = block.querySelector('.upload-preview');

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    uploadZone.classList.add('has-file');
    let displayUrl = '';
    let processedBase64 = null;
    if (file.type.startsWith('image/')) {
      const result = await compressImage(file);
      processedBase64 = result.base64;
      displayUrl = result.base64;
    } else if (file.type === 'application/pdf') {
      processedBase64 = await fileToBase64(file);
    }
    block.dataset.receiptBase64 = processedBase64 || '';
    block.dataset.receiptFileName = file.name;
    previewEl.style.display = 'flex';
    previewEl.innerHTML = `
      ${displayUrl ? `<img src="${displayUrl}" alt="">` : '<div style="width:52px;height:52px;border-radius:6px;background:var(--purple-light);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--purple);font-weight:700;">PDF</div>'}
      <div class="file-meta"><strong>${escapeHtml(file.name)}</strong>${(file.size/1024).toFixed(0)} KB</div>
    `;
  });

  const removeBtn = block.querySelector('.remove-item');
  if (removeBtn) {
    removeBtn.addEventListener('click', () => {
      block.remove();
      renumberItems();
      updateTotal();
      updateAddButton();
    });
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressImage(file, maxDimension = 1600, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDimension) {
          height = Math.round(height * (maxDimension / width));
          width = maxDimension;
        } else if (height > maxDimension) {
          width = Math.round(width * (maxDimension / height));
          height = maxDimension;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const base64 = canvas.toDataURL('image/jpeg', quality);
        resolve({ base64, width, height });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renumberItems() {
  const blocks = itemsContainer.querySelectorAll('.item-block');
  blocks.forEach((block, idx) => {
    const n = idx + 1;
    block.dataset.itemIndex = n;
    block.querySelector('.item-number').textContent = n;
    const h2 = block.querySelector('h2');
    h2.innerHTML = `${t('item')} ${n}${n === 1 ? '' : ' <span class="optional" style="text-transform:none;font-weight:400;">' + t('optionalTag') + '</span>'}`;
  });
}

function updateAddButton() {
  const blocks = itemsContainer.querySelectorAll('.item-block').length;
  addItemBtn.disabled = blocks >= MAX_ITEMS;
  addItemBtn.textContent = blocks >= MAX_ITEMS ? t('addItemMax', MAX_ITEMS) : t('addItem');
}

function updateTotal() {
  const amounts = itemsContainer.querySelectorAll('.item-amount');
  let total = 0;
  amounts.forEach(input => { total += parseFloat(input.value) || 0; });
  totalAmountEl.textContent = total.toFixed(2) + t('totalSuffix');

  const n = itemsContainer.querySelectorAll('.item-block').length;
  itemCountLabelEl.textContent = t('itemCount', n);
}

addItemBtn.addEventListener('click', () => {
  const currentCount = itemsContainer.querySelectorAll('.item-block').length;
  if (currentCount >= MAX_ITEMS) return;
  const block = buildItemBlock(currentCount + 1);
  itemsContainer.appendChild(block);
  updateAddButton();
  updateTotal();
  if (typeof block.scrollIntoView === 'function') {
    block.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

companySelect.addEventListener('change', () => {
  branchField.style.display = companySelect.value === 'BIANCA HOLDING' ? 'block' : 'none';
});

// ---- Initial state ----
itemsContainer.appendChild(buildItemBlock(1));
updateAddButton();
updateTotal();

// ============================================================
// PAYEE DROPDOWN — populated live from the "Payees" sheet tab
// ============================================================
async function loadPayees() {
  if (SUBMIT_URL.indexOf('PASTE_YOUR') === 0) return; // not configured yet

  try {
    const res = await fetch(SUBMIT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getPayees' })
    });
    const data = await res.json();
    const names = Array.isArray(data.payees) ? data.payees : [];

    names.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      payeeSelect.appendChild(opt);
    });
  } catch (err) {
    // Silent fail — the default option (blank = uses fallback name server-side)
    // still works fine even if the live list couldn't be fetched.
    console.warn('Could not load payees list:', err);
  }
}
loadPayees();

// ============================================================
// VALIDATION + SUBMIT
// ============================================================
function setFieldError(fieldEl, isInvalid) {
  fieldEl.classList.toggle('invalid', isInvalid);
}

function validateForm() {
  let valid = true;

  const companyField = document.querySelector('[data-field="company"]');
  if (!companySelect.value) { setFieldError(companyField, true); valid = false; }
  else setFieldError(companyField, false);

  const dueDateField = document.querySelector('[data-field="dueDate"]');
  const dueDateInput = document.getElementById('dueDate');
  if (!dueDateInput.value) { setFieldError(dueDateField, true); valid = false; }
  else setFieldError(dueDateField, false);

  const firstBlock = itemsContainer.querySelector('.item-block[data-item-index="1"]');
  if (firstBlock) {
    const checks = [
      ['.item-date', 'date'],
      ['.item-particulars', 'particulars'],
      ['.item-supplier', 'supplier'],
      ['.item-amount', 'amount']
    ];
    checks.forEach(([selector, fieldName]) => {
      const input = firstBlock.querySelector(selector);
      const fieldEl = firstBlock.querySelector(`[data-field="${fieldName}"]`);
      const isEmpty = !input.value || (fieldName === 'amount' && parseFloat(input.value) <= 0);
      setFieldError(fieldEl, isEmpty);
      if (isEmpty) valid = false;
    });
  }

  const otherBlocks = itemsContainer.querySelectorAll('.item-block:not([data-item-index="1"])');
  otherBlocks.forEach(block => {
    const dateInput = block.querySelector('.item-date');
    const particularsInput = block.querySelector('.item-particulars');
    const supplierInput = block.querySelector('.item-supplier');
    const amountInput = block.querySelector('.item-amount');

    const values = {
      date: dateInput.value,
      particulars: particularsInput.value.trim(),
      supplier: supplierInput.value.trim(),
      amount: parseFloat(amountInput.value) || 0
    };

    const anyFilled = values.date || values.particulars || values.supplier || values.amount > 0;
    const allFilled = values.date && values.particulars && values.supplier && values.amount > 0;

    if (anyFilled && !allFilled) {
      const fieldMap = {
        date: ['.item-date', 'date'],
        particulars: ['.item-particulars', 'particulars'],
        supplier: ['.item-supplier', 'supplier'],
        amount: ['.item-amount', 'amount']
      };
      Object.entries(fieldMap).forEach(([key, [selector, fieldName]]) => {
        const fieldEl = block.querySelector(`[data-field="${fieldName}"]`);
        const isEmpty = key === 'amount' ? values.amount <= 0 : !values[key];
        setFieldError(fieldEl, isEmpty);
        if (isEmpty) valid = false;
      });
    } else {
      block.querySelectorAll('.field').forEach(f => setFieldError(f, false));
    }
  });

  return valid;
}

function collectPayload() {
  const blocks = Array.from(itemsContainer.querySelectorAll('.item-block'));

  const items = blocks
    .map(block => {
      const date = block.querySelector('.item-date').value;
      const particulars = block.querySelector('.item-particulars').value.trim();
      const supplier = block.querySelector('.item-supplier').value.trim();
      const amount = parseFloat(block.querySelector('.item-amount').value) || 0;
      const receiptBase64 = block.dataset.receiptBase64 || '';
      const receiptFileName = block.dataset.receiptFileName || '';
      return { date, particulars, supplier, amount, receiptBase64, receiptFileName };
    })
    .filter(item => item.date && item.particulars && item.supplier && item.amount > 0);

  return {
    company: companySelect.value,
    branch: companySelect.value === 'BIANCA HOLDING' ? document.getElementById('branch').value : '',
    payee: payeeSelect.value,
    dueDate: document.getElementById('dueDate').value,
    items
  };
}

function showOverlay(state, message) {
  overlay.classList.add('show');
  if (state === 'loading') {
    overlayCard.className = 'overlay-card';
    overlayCard.innerHTML = `
      <div class="spinner"></div>
      <h3>${t('submittingTitle')}</h3>
      <p>${t('submittingBody')}</p>
    `;
  } else if (state === 'success') {
    overlayCard.className = 'overlay-card success';
    overlayCard.innerHTML = `
      <div class="icon">✅</div>
      <h3>${t('successTitle')}</h3>
      <p>${message}</p>
      <button type="button" id="overlayCloseBtn">${t('submitAnother')}</button>
    `;
    document.getElementById('overlayCloseBtn').addEventListener('click', () => window.location.reload());
  } else if (state === 'error') {
    overlayCard.className = 'overlay-card error';
    overlayCard.innerHTML = `
      <div class="icon">⚠️</div>
      <h3>${t('errorTitle')}</h3>
      <p>${message}</p>
      <button type="button" id="overlayCloseBtn">${t('tryAgain')}</button>
    `;
    document.getElementById('overlayCloseBtn').addEventListener('click', () => overlay.classList.remove('show'));
  }
}

document.getElementById('pettyForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!validateForm()) {
    const invalidField = document.querySelector('.field.invalid');
    if (invalidField && typeof invalidField.scrollIntoView === 'function') {
      invalidField.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return;
  }

  if (SUBMIT_URL.indexOf('PASTE_YOUR') === 0) {
    showOverlay('error', t('notConnected'));
    return;
  }

  submitBtn.disabled = true;
  showOverlay('loading');

  const payload = collectPayload();

  try {
    const res = await fetch(SUBMIT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (data.success) {
      showOverlay('success', t('successBody', data.docNumber));
    } else {
      showOverlay('error', data.error || t('genericError'));
      submitBtn.disabled = false;
    }
  } catch (err) {
    showOverlay('error', t('networkError'));
    submitBtn.disabled = false;
  }
});
</script>
